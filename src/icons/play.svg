<!-- Filled play triangle, for the badge that marks a film.
     Local because Lucide ships only an outlined variant, and an outline at 10px reads as a
     smudge with a hole in it. Rounded corners, so it sits with the rest of the set.
     Drawn by hand here, like pause.svg beside it - and like it, there is nothing in the
     shape to get wrong. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
  <path d="M8.2 4.6a1.5 1.5 0 0 1 2.27-1.29l9.1 5.4a1.5 1.5 0 0 1 0 2.58l-9.1 5.4A1.5 1.5 0 0 1 8.2 15.4Z" transform="translate(0 2)"/>
</svg>
